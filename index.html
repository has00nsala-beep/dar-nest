<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dar Nest – إدارة الفواتير</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--cd:#fff;--ink:#1f2a44;--mu:#6b7a99;--ln:#e1eafa;--ac:#ff7a2f;--ai:#fff;--wr:#e5484d;--ok:#12b886;--nd:#fff3d6;--a2:#6c5ce7;--sh:0 6px 18px rgba(76,110,245,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121629;--cd:#1b2140;--ink:#eef1ff;--mu:#a3acd0;--ln:#2b3358;--ac:#ff9a5c;--ai:#2a1204;--a2:#a99bff;--sh:none;--wr:#ff8a7d;--ok:#4cc790;--nd:#3b3317}}
:root[data-theme="dark"]{--bg:#121629;--cd:#1b2140;--ink:#eef1ff;--mu:#a3acd0;--ln:#2b3358;--ac:#ff9a5c;--ai:#2a1204;--a2:#a99bff;--sh:none;--wr:#ff8a7d;--ok:#4cc790;--nd:#3b3317}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;line-height:1.6}
header{background:#000;color:#fff;box-shadow:var(--sh);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}header .m{color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;gap:8px}
.top b{font-size:19px;color:#fff}nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px}
nav a{white-space:nowrap;padding:6px 16px;border-radius:99px;color:#fff;background:#ffffff2e;text-decoration:none;font-weight:600}
nav a.on{background:#fff;color:#000}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.cs .card{margin:0;border-top:4px solid var(--ac)}.cs .card:nth-child(4n+2){border-top-color:var(--a2)}.cs .card:nth-child(4n+3){border-top-color:var(--ok)}.cs .card:nth-child(4n){border-top-color:#ffb020}.cs small{color:var(--mu)}.cs strong{display:block;font-size:24px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.ch{width:100%}
h1,h2,h3{margin:0 0 10px}h3{font-size:15px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:8px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%;margin-top:3px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.need{background:var(--nd)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px;align-items:end}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px}
.b{background:linear-gradient(135deg,#ff7a2f,#ff4f81);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(255,100,80,.3)}.b2{background:var(--bg);color:var(--ink);border:1px solid var(--ln)}.bd{background:none;color:var(--wr)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--a2);font-weight:700}tbody tr:hover{background:var(--bg)}h2{color:var(--ink)}
td input{min-width:70px;margin:0}
.lg{min-height:100vh;display:grid;place-items:center;padding:16px}.lg .card{width:100%;max-width:360px}
.m{color:var(--mu);font-size:13px}.er{color:var(--wr);min-height:22px}
.nt{background:var(--nd);border-radius:8px;padding:10px;margin-bottom:12px;font-size:14px}
#m{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:9;padding:12px}
#m.o{display:grid}.bx{background:var(--cd);color:var(--ink);border-radius:12px;padding:16px;max-width:720px;width:100%;max-height:92vh;overflow:auto}
.bx img{max-width:100%;border-radius:8px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tg{position:fixed;bottom:16px;inset-inline:16px;margin:auto;max-width:320px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;text-align:center;z-index:20}
@media print{.noprint{display:none!important}body.mo #app{display:none}#m{position:static;background:none;display:block}.bx{max-height:none}}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%;min-height:60px;margin-top:3px}
.lgb{background:#fff;border-radius:10px;padding:3px 10px;display:inline-flex}.lgb img{height:54px;display:block}
#pr{display:none}button{transition:transform .1s}button:active{transform:scale(.96)}
.pg{color:#000;background:#fff;font-size:12px}.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ph h1{margin:0;font-size:22px}.plg img{height:80px;display:block}.plg small{display:block;font-size:9px;letter-spacing:4px}.pno{color:#c00;font-weight:700;font-size:18px}
.pgr{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid #000;margin-bottom:8px}.pgr div{padding:5px 8px;border:1px solid #000}
.pt{border:1.5px solid #000}.pt th,.pt td{border:1px solid #000;padding:5px 6px;color:#000;white-space:normal}.pt th{background:#eee}
.ptm{font-size:10px;white-space:pre-wrap;margin-top:8px}.pft{text-align:center;margin-top:10px;font-weight:700}.psg{display:flex;justify-content:space-between;margin-top:36px;text-align:center}.psg div{width:30%;border-top:1px dotted #000;padding-top:4px}
@media print{@page{size:A4;margin:10mm}body.pp #app,body.pp #m,body.pp .tg{display:none!important}body.pp #pr{display:block}body.pp{background:#fff}}

function rc(){const s=sum(cur.items,y=>y.t),d=cur.dtype=='amt'?cur.disc:s*cur.disc/100;cur.sub=s;cur.dpct=s?d/s*100:0;cur.total=Math.max(0,s-d);const e=$('#sm');if(e)e.innerHTML=`قبل الخصم: <b>${N(s)}</b> • الخصم: <b>${N(d)}</b> (${N(cur.dpct)}%) • بعد الخصم: <b>${N(cur.total)}</b> • المتبقي: <b>${N(cur.total-cur.paid)}</b>`}

async function sv(){const c=cur;if(!c.cust.trim()||!c.p1.trim()||!c.dd)return toast('أدخل اسم العميل ورقم العميل وتاريخ التسليم');

rc();if(!(c.total>0))return toast('الإجمالي يجب أن يكون أكبر من صفر');
if(c.dpct>cap()+1e-6)return toast('الخصم أكبر من الحد المسموح لك ('+cap()+'%). اطلب من المدير أو المالك.');
if(c.paid<0||c.paid>c.total)return toast('العربون يجب أن يكون بين صفر والإجمالي');

try{const ref=fs.doc('counters/invoice');
const n=await fs.runTransaction(async t=>{const cs=await t.get(ref),last=cs.exists?(+cs.data().last||0):0,nn=Math.max(+S.start||2001,last+1);
c.no=String(nn);c.id=nn;c.created=T();c.status='مؤكدة';c.by=me.id;c.pays=[];
t.set(ref,{last:nn});t.set(fs.doc('invoices/'+nn),c);return nn});
toast('تم حفظ الفاتورة رقم '+n);location.hash='#/inv'}

function pRep(){return`<h2>التقارير</h2><div class="card noprint"><div class="fl"><label>من تاريخ<input type="date" value="${R.from}" oninput="R.from=this.value;rep()"></label><label>إلى تاريخ<input type="date" value="${R.to}" oninput="R.to=this.value;rep()"></label><label>نوع التقرير<select oninput="R.g=this.value;rep()">${[['day','مبيعات يومية'],['week','مبيعات أسبوعية'],['month','مبيعات شهرية'],['emp','حسب الموظف'],['br','حسب الفرع'],['cust','حسب العميل']].map(o=>`<option value="${o[0]}" ${R.g==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label></div><div class="row"><button class="b2" onclick="ex('xls')">تصدير Excel</button><button class="b2" onclick="print()">تصدير PDF</button><button class="b2" onclick="ex('csv')">تصدير CSV</button></div></div><div class="card" id="rb"></div>`}
function rep(){const wk=d=>{const x=new Date(d);x.setDate(x.getDate()-x.getDay());return x.toISOString().slice(0,10)};
const kf={day:i=>i.date,week:i=>wk(i.date),month:i=>i.date.slice(0,7),emp:i=>i.emp,br:i=>i.branch||'—',cust:i=>i.cust||'—'}[R.g],m={};
vis().filter(i=>(!R.from||i.date>=R.from)&&(!R.to||i.date<=R.to)).forEach(i=>{const k=kf(i),a=m[k]||(m[k]=[k,0,0,0,0]);a[1]++;a[2]+=i.total;a[3]+=i.paid;a[4]+=rem(i)});
RD=Object.values(m).sort((a,b)=>['day','week','month'].includes(R.g)?b[0].localeCompare(a[0]):b[2]-a[2]);
const tot=['الإجمالي',sum(RD,r=>r[1]),sum(RD,r=>r[2]),sum(RD,r=>r[3]),sum(RD,r=>r[4])];RD.push(tot);
$('#rb').innerHTML=`<div class="tw"><table><thead><tr><th>${{day:'اليوم',week:'بداية الأسبوع',month:'الشهر',emp:'الموظف',br:'الفرع',cust:'العميل'}[R.g]}<th>عدد الفواتير<th>المبيعات<th>المدفوع<th>المتبقي</thead><tbody>${RD.map((r,i)=>`<tr ${i==RD.length-1?'style="font-weight:700"':''}><td>${H(r[0])}<td>${N(r[1])}<td>${N(r[2])}<td>${N(r[3])}<td>${N(r[4])}</tr>`).join('')}</tbody></table></div>`}
function ex(t){const hd=['البند','عدد الفواتير','المبيعات','المدفوع','المتبقي'];let b,n='report.'+t;
if(t=='csv')b=new Blob(['\ufeff'+[hd,...RD].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
else b=new Blob([`<html dir="rtl"><meta charset="utf-8"><table border="1"><tr>${hd.map(h=>`<th>${h}`).join('')}</tr>${RD.map(r=>`<tr>${r.map(c=>`<td>${H(c)}`).join('')}</tr>`).join('')}</table></html>`],{type:'application/vnd.ms-excel'});
dl(n,b)}
